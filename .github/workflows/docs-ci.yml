name: Publish Docs Website

on:
  push:
    branches: [ main ]
    paths:
      - '**/docs/**'
      - 'docs-config/mkdocs.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy -f docs-config/mkdocs.yml --force
