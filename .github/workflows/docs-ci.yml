name: Publish Docs Website (Zensical)

on:
  push:
    branches: [ main ]
    paths:
      - '**/docs/**'
      - 'mkdocs.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Zensical
        run: pip install --upgrade zensical
      - name: Assemble Docs Tree
        run: |
          mkdir -p build-docs/bunk-and-desk-node
          cp README.md build-docs/index.md
          cp -r bunk-and-desk-node/docs/* build-docs/bunk-and-desk-node/
      - name: Build Documentation Site
        run: zensical build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: false
          enable_jekyll: false
