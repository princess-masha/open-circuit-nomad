  - Bunk & Desk Node:
      - Requirements (Req-as-Code): bunk-and-desk-node/requirements.md
      - System Architecture: bunk-and-desk-node/architecture.md
      - 230V Safety & EMC Notes: bunk-and-desk-node/safety-and-emc.md
      - Verification Plan: bunk-and-desk-node/verification.md
